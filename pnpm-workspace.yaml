packages:
  - ./*
allowBuilds:
  "@parcel/watcher": true
  # Usage telemetry pulled in by swagger-ui-dist; nothing needs it to run.
  "@scarf/scarf": false
  "@swc/core": true
  cpu-features: true
  esbuild: true
  protobufjs: true
  # Ships prebuilt binaries via @img/* packages; its script only compiles from source as a fallback.
  sharp: false
  ssh2: true
  unrs-resolver: true
